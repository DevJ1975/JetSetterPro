# Daemon JVM criteria. Version-only on purpose: pinning vendor=jetbrains (what Android Studio's
# `updateDaemonJvm` emits, since Studio ships the JetBrains Runtime) breaks any environment
# without JBR — Gradle has no auto-provisioning URL for that vendor, so CI failed before
# compiling anything. Any local JDK 21 (Temurin on CI, JBR in Studio) satisfies this.
toolchainVersion=21
