[versions]
# ⚠️ These toolchain versions are coupled — change them together:
#   • Current, verified-green stack: AGP 9.2.1 + Gradle 9.4.1 (gradle/wrapper) + Kotlin 2.3.21.
#   • `ksp` versions independently (2.3.x); KSP2 requires Room 2.7+ and Kotlin 2.3.
#   • Hilt 2.58 reads Kotlin 2.3 metadata and builds/dexes cleanly on AGP 9.2.1 (verified via
#     assembleDebug). Hilt 2.59+ (POST_COMPILATION_CLASSES) is the intended AGP 9 pairing —
#     bump when convenient, but 2.58 is not blocked on it.
agp = "9.2.1"
kotlin = "2.3.21"
ksp = "2.3.9"
coreKtx = "1.15.0"
splashscreen = "1.0.1"
lifecycle = "2.8.7"
activityCompose = "1.9.3"
composeBom = "2024.12.01"
navigationCompose = "2.8.5"
hilt = "2.58"
hiltNavigationCompose = "1.2.0"
# androidx.hilt work integration (@HiltWorker + HiltWorkerFactory, plan R6). Kept on the same
# 1.2.0 line as hilt-navigation-compose — the androidx.hilt artifacts version together.
hiltWork = "1.2.0"
room = "2.7.2"
retrofit = "2.11.0"
okhttp = "4.12.0"
moshi = "1.15.1"
# Supabase — shared backend with the iOS app. supabase-kt 3.1.4 pins ktor-client-core 3.1.2,
# so the OkHttp engine must match that version. Brings Ktor 3 + kotlinx.serialization in
# alongside the existing Retrofit/OkHttp/Moshi stack; they coexist — nothing here replaces Firebase.
supabase = "3.1.4"
ktor = "3.1.2"
coroutines = "1.9.0"
datastore = "1.1.1"
coil = "2.7.0"
work = "2.10.0"
mapsCompose = "8.3.0"
playServicesMaps = "19.2.0"
# On-device AI. ML Kit GenAI Prompt API drives free-form Gemini Nano (AICore) inference; MediaPipe
# tasks-text runs the on-device text embedder used for RAG retrieval. Both are device-gated and
# degrade to no-op (Claude/RAG-off) where unsupported — see core/ai + core/rag.
mlkitGenaiPrompt = "1.0.0-beta2"
# ⚠️ Keep >= 0.10.26: earlier releases ship libmediapipe_tasks_text_jni.so with 4 KB ELF LOAD
# alignment, which trips the OS 16 KB page-size compatibility dialog (and future hard failure)
# on 16 KB devices/AVDs. 0.10.26+ is 16 KB-aligned (arm64-v8a + armeabi-v7a only — no x86*,
# so x86 emulators lose the embedder and RAG degrades gracefully).
mediapipeTasksText = "0.10.26.1"
# ML Kit Text Recognition v2 (Latin script, bundled model) — on-device receipt OCR (spec §2.3/§3.1).
# Unlike genai-prompt this model ships inside the APK, so it runs on every device with no
# AICore/Play-services download gate. Google Vision is the Phase 3 cloud fallback (see core/ocr).
mlkitTextRecognition = "16.0.1"
# EncryptedSharedPreferences backing for the Supabase session (core/auth/EncryptedSessionManager).
# ⚠️ Jetpack deprecated this library at 1.1.0 (final release) — acceptable here because the usage
# is fully owned by the one EncryptedSessionManager seam and can be swapped without call-site churn.
securityCrypto = "1.1.0"
junit = "4.13.2"
androidxJunit = "1.2.1"
espresso = "3.6.1"

