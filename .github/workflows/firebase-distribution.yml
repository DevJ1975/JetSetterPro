name: Firebase App Distribution

# Builds the demo APK and pushes it to Firebase App Distribution so testers install it from an
# email invite / the App Tester app — a much gentler flow than hand-sharing an APK file.
#
# This is a CI-only integration: the Firebase App Distribution CLI uploads the finished APK as an
# opaque binary. The app itself does NOT depend on the Firebase SDK (Firebase was retired in favor
# of Supabase), and no google-services.json is added — nothing about the build or the app's runtime
# changes. See docs/FIREBASE_DISTRIBUTION.md for the one-time setup (project, App ID, service
# account, tester group, secrets).
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   FIREBASE_APP_ID          e.g. 1:1234567890:android:abcdef0123456789
#   FIREBASE_SERVICE_ACCOUNT the full JSON of a service account with the
#                            "Firebase App Distribution Admin" role
# Optional repo variable:
#   FIREBASE_TESTER_GROUPS   comma-separated tester group aliases (default: "testers")

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: "What testers should know about this build"
        required: false
        default: "Latest JetSetter Pro demo build."
      groups:
        description: "Tester group alias(es), comma-separated (must exist in Firebase)"
        required: false
        default: ""

jobs:
  distribute:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preflight — confirm Firebase secrets are set
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          missing=0
          if [ -z "$FIREBASE_APP_ID" ]; then
            echo "::error::Secret FIREBASE_APP_ID is not set. See docs/FIREBASE_DISTRIBUTION.md."
            missing=1
          fi
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Secret FIREBASE_SERVICE_ACCOUNT is not set. See docs/FIREBASE_DISTRIBUTION.md."
            missing=1
          fi
          [ "$missing" -eq 0 ] || exit 1

      # JDK 21 to satisfy gradle/gradle-daemon-jvm.properties (toolchainVersion=21).
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build (assembleDebug)
        run: ./gradlew assembleDebug --stacktrace

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Write service-account credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"

      - name: Distribute to testers
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
          # Precedence: the run's input, else the repo variable, else "testers".
          INPUT_GROUPS: ${{ github.event.inputs.groups }}
          VAR_GROUPS: ${{ vars.FIREBASE_TESTER_GROUPS }}
          RELEASE_NOTES: ${{ github.event.inputs.release_notes }}
        run: |
          groups="${INPUT_GROUPS:-${VAR_GROUPS:-testers}}"
          echo "Distributing to tester group(s): $groups"
          firebase appdistribution:distribute \
            app/build/outputs/apk/debug/app-debug.apk \
            --app "$FIREBASE_APP_ID" \
            --groups "$groups" \
            --release-notes "$RELEASE_NOTES"

      - name: Clean up credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-sa.json"
